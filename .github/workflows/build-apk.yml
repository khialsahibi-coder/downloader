name: Build KHSahibi APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev libssl-dev \
            automake build-essential ccache

      - name: Install Buildozer & Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==3.0.10 virtualenv

      - name: Cache Buildozer directories
        uses: actions/cache@v5
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-v3-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Build debug APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee buildozer.log || {
            echo "================ EXACT ERROR ================"
            grep -iE "error:|exception|failed|clang:|fatal:" buildozer.log | tail -n 30
            echo "================ LAST 25 LINES ==============="
            tail -n 25 buildozer.log
            exit 1
          }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
          if-no-files-found: error
