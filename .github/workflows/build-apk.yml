name: Build KHSahibi APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev ccache automake

      - name: Install buildozer
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --user buildozer cython==0.29.36
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Cache android SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/android/platform/android-sdk
            ~/.buildozer/android/platform/android-ndk-r25b
          key: android-sdk-ndk-${{ hashFiles('buildozer.spec') }}
          restore-keys: android-sdk-ndk-
          
      - name: Build debug APK
        run: |
         buildozer -v android debug 2>&1 | tee buildozer.log || {
         echo "================ EXACT ERROR ================"
         grep -iE "error:|exception|failed|clang:|fatal:" buildozer.log | tail -n 30
         echo "================ LAST 25 LINES ==============="
         tail -n 25 buildozer.log
         exit 1
         }


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: khsahibi-vdownloader-apk
          path: bin/*.apk
          if-no-files-found: error
